<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="#1B2A4A"/>
  <!-- Left ear -->
  <ellipse cx="11" cy="20" rx="6" ry="7" fill="#F5B8C4"/>
  <ellipse cx="11" cy="20" rx="4" ry="5" fill="#EF9CAA"/>
  <!-- Right ear -->
  <ellipse cx="37" cy="20" rx="6" ry="7" fill="#F5B8C4"/>
  <ellipse cx="37" cy="20" rx="4" ry="5" fill="#EF9CAA"/>
  <!-- Head -->
  <ellipse cx="24" cy="27" rx="16" ry="15" fill="#F5B8C4"/>
  <!-- Eyes -->
  <circle cx="18" cy="24" r="3" fill="white"/>
  <circle cx="30" cy="24" r="3" fill="white"/>
  <circle cx="18.5" cy="24.5" r="1.8" fill="#2C2416"/>
  <circle cx="30.5" cy="24.5" r="1.8" fill="#2C2416"/>
  <!-- Eye shine -->
  <circle cx="19.5" cy="23.5" r="0.8" fill="white"/>
  <circle cx="31.5" cy="23.5" r="0.8" fill="white"/>
  <!-- Snout -->
  <ellipse cx="24" cy="32" rx="8" ry="6" fill="#EF9CAA"/>
  <circle cx="21" cy="32" r="1.7" fill="#C47A8A"/>
  <circle cx="27" cy="32" r="1.7" fill="#C47A8A"/>
  <!-- Smile with gold tooth -->
  <path d="M19 37 Q24 41 29 37" stroke="#2C2416" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <rect x="22.5" y="37" width="3.5" height="3" rx="0.5" fill="#C9A84C"/>
  <!-- Straw hat -->
  <ellipse cx="24" cy="14" rx="14" ry="4" fill="#C4A35A"/>
  <rect x="15" y="7" width="18" height="9" rx="3" fill="#D4B46A"/>
  <rect x="15" y="11" width="18" height="3.5" rx="1.5" fill="#1B2A4A"/>
</svg>
